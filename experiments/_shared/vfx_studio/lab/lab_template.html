<title>Labo VFX R6</title>
<style>
  /* un seul thème sombre, voulu : c'est un visionneur d'effets lumineux */
  :root { color-scheme: dark; --fond: #111217; --panneau: #1a1c23; --trait: #2d313c; --texte: #e8e6df; --doux: #9197a3; --or: #ffc53d; }
  * { box-sizing: border-box; }
  body { margin: 0; padding-inline: 16px; padding-block: 12px; background: var(--fond); color: var(--texte); font: 14px/1.4 system-ui, sans-serif; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
  #stage { position: relative; width: 100%; max-width: 100%; border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; max-height: 78vh; background: #000; }
  #stage canvas { width: 100%; height: 100%; display: block; }
  #barre { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--panneau); border-top: 1px solid var(--trait); }
  button, select { background: #242833; color: var(--texte); border: 1px solid var(--trait); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--or); color: var(--or); }
  input[type=range] { flex: 1 1 200px; min-width: 120px; }
  #info { padding: 8px 16px; color: var(--doux); font-size: 13px; }
  .grp { display: flex; gap: 4px; flex-wrap: wrap; }
</style>
<div id="stage"></div>
<div id="barre">
  <select id="recette" aria-label="Recette"></select>
  <button id="play" aria-pressed="true">Pause</button>
  <input id="temps" type="range" min="0" max="1000" value="0" aria-label="Temps">
  <span id="t">0.00 s</span>
  <div class="grp" id="vitesses"></div>
  <div class="grp" id="cams"></div>
  <button id="bloom" aria-pressed="true">Bloom</button>
</div>
<div id="info"></div>
<script>__THREE__</script>
<script>__MOTEUR__</script>
<script>
(function () {
  const T = THREE;
  const DATA = __DATA__;
  VFX.loadTextures(DATA.textures);
  VFX.loadMeshes(DATA.meshes);
  const stage = document.getElementById("stage");
  const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  stage.appendChild(renderer.domElement);
  const scene = new T.Scene();
  scene.background = new T.Color("#7f9ab8");
  const camera = new T.PerspectiveCamera(50, 16 / 9, 0.05, 500);
  // sol à damier (façon baseplate) + mannequins R6 pour l'échelle
  const cv = document.createElement("canvas"); cv.width = cv.height = 64;
  const g = cv.getContext("2d"); g.fillStyle = "#6c7280"; g.fillRect(0, 0, 64, 64); g.fillStyle = "#636976"; g.fillRect(0, 0, 32, 32); g.fillRect(32, 32, 32, 32);
  const tx = new T.CanvasTexture(cv); tx.wrapS = tx.wrapT = T.RepeatWrapping; tx.repeat.set(40, 40); tx.magFilter = T.NearestFilter;
  const sol = new T.Mesh(new T.PlaneGeometry(160, 160), new T.MeshBasicMaterial({ map: tx }));
  sol.rotation.x = -Math.PI / 2; scene.add(sol);
  function mannequin(x, z, rotY, teinte) {
    const m = new T.Group();
    const part = (w, h, d, px, py, c) => { const b = new T.Mesh(new T.BoxGeometry(w, h, d), new T.MeshBasicMaterial({ color: c })); b.position.set(px, py, 0); m.add(b); };
    part(2, 2, 1, 0, 3, teinte[0]); part(1.2, 1.2, 1.2, 0, 4.6, teinte[1]);
    part(1, 2, 1, -1.5, 3, teinte[1]); part(1, 2, 1, 1.5, 3, teinte[1]);
    part(1, 2, 1, -0.5, 1, teinte[2]); part(1, 2, 1, 0.5, 1, teinte[2]);
    m.position.set(x, 0, z); m.rotation.y = rotY; scene.add(m); return m;
  }
  const m1 = mannequin(0, 8.5, 0, ["#2b2b33", "#e8b98a", "#23232a"]);
  const m2 = mannequin(0, -9, Math.PI, ["#3d7bd6", "#f2d14b", "#a8c94b"]);
  const bloom = VFX.Bloom(renderer, 1280, 720);
  let effet = null, rec = null, t = 0, playing = true, vitesse = 1, useBloom = true, camNom = null, objs = [];
  const orbit = { th: 0.7, ph: 1.2, r: 22 };

  const sel = document.getElementById("recette");
  for (const k in DATA.recettes) { const o = document.createElement("option"); o.value = k; o.textContent = DATA.recettes[k].titre || k; sel.appendChild(o); }
  function setRecette(nom) {
    for (const o of objs) scene.remove(o);
    rec = DATA.recettes[nom];
    effet = VFX.Effet(rec, scene);
    objs = effet.couches.map((c) => c.obj);
    const presence = rec.nom === "orbe_impact";
    m1.visible = m2.visible = presence;
    t = 0; sel.value = nom;
    const cams = document.getElementById("cams"); cams.innerHTML = "";
    for (const k of Object.keys(rec.cameras || {}).concat(["libre"])) {
      const b = document.createElement("button"); b.textContent = k; b.dataset.cam = k;
      b.onclick = () => setCam(k); cams.appendChild(b);
    }
    setCam(Object.keys(rec.cameras || {})[0] || "libre");
    document.getElementById("info").textContent = (rec.titre || rec.nom) + " — " + rec.couches.length + " couches, " + rec.duree + " s, palette " + (rec.palette || []).join(" ");
  }
  function setCam(k) { camNom = k; document.querySelectorAll("#cams button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cam === k))); }
  sel.onchange = () => setRecette(sel.value);
  document.getElementById("play").onclick = (e) => { playing = !playing; e.target.textContent = playing ? "Pause" : "Lecture"; e.target.setAttribute("aria-pressed", String(playing)); };
  document.getElementById("bloom").onclick = (e) => { useBloom = !useBloom; e.target.setAttribute("aria-pressed", String(useBloom)); };
  const vs = document.getElementById("vitesses");
  for (const v of [1, 0.25, 0.1]) { const b = document.createElement("button"); b.textContent = "×" + v; b.onclick = () => { vitesse = v; vs.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }; if (v === 1) b.setAttribute("aria-pressed", "true"); vs.appendChild(b); }
  const slider = document.getElementById("temps");
  slider.oninput = () => { playing = false; document.getElementById("play").textContent = "Lecture"; t = (slider.value / 1000) * rec.duree; };
  let drag = null;
  stage.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; setCam("libre"); });
  window.addEventListener("pointerup", () => (drag = null));
  window.addEventListener("pointermove", (e) => { if (!drag) return; orbit.th -= (e.clientX - drag[0]) * 0.006; orbit.ph = Math.min(1.5, Math.max(0.15, orbit.ph - (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; });
  stage.addEventListener("wheel", (e) => { e.preventDefault(); orbit.r = Math.min(80, Math.max(4, orbit.r * (1 + Math.sign(e.deltaY) * 0.08))); }, { passive: false });

  function placeCam() {
    const c = rec.cameras && rec.cameras[camNom];
    if (c) { camera.position.fromArray(c.oeil); camera.lookAt(new T.Vector3().fromArray(c.cible)); camera.fov = c.fov || 50; }
    else { const cible = new T.Vector3(0, 2, 0); camera.position.set(cible.x + orbit.r * Math.sin(orbit.ph) * Math.sin(orbit.th), cible.y + orbit.r * Math.cos(orbit.ph), cible.z + orbit.r * Math.sin(orbit.ph) * Math.cos(orbit.th)); camera.lookAt(cible); camera.fov = 50; }
    camera.updateProjectionMatrix();
  }
  function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  window.addEventListener("resize", resize);

  let derniers = 0;
  function rendu() {
    placeCam();
    camera.updateMatrixWorld();
    const p = effet.post(t);
    camera.position.add(p.secousse); camera.updateMatrixWorld();
    derniers = effet.update(t, camera);
    if (useBloom) bloom.render(scene, camera, p);
    else { renderer.setRenderTarget(null); renderer.render(scene, camera); }
    slider.value = String(Math.round((t / rec.duree) * 1000));
    document.getElementById("t").textContent = t.toFixed(2) + " s";
  }
  let last = performance.now();
  function boucle(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) { t += dt * vitesse; if (t > rec.duree) t = 0; }
    rendu();
    requestAnimationFrame(boucle);
  }
  resize();
  setRecette(Object.keys(DATA.recettes)[0]);
  requestAnimationFrame(boucle);
  window.__vfx = {
    seek: (x) => { playing = false; t = x; rendu(); },
    setRecette, setCam, setBloom: (v) => { useBloom = v; }, duree: () => rec.duree,
    couches: () => effet.couches.map((c) => ({ nom: c.L ? c.L.nom : 'projectile', visible: c.obj.visible })), stats: () => ({ elements: derniers }),
  };
})();
</script>
